[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exp-viewer"
version = "0.2.0"
description = "Experiment data visualization toolkit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "plotly>=5.18",
    "jinja2>=3.1",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
exp-viewer = "exp_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exp_viewer"]
